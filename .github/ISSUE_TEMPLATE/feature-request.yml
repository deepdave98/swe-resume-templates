name: Improvement idea
description: Suggest a focused improvement to the templates or documentation.
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the problem or use case before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - No Internship template
        - New Grad template
        - Experienced (1 page) template
        - Experienced (2 pages) template
        - Multiple templates
        - Repository or documentation
    validations:
      required: true
