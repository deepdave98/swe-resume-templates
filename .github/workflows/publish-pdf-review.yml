name: Publish PDF review

# Opt-in hosting: merge and enable Pages before running this on main.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-review-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/pdf-review/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/pdf-review
      - run: npm run check && npm run build && npm test
        working-directory: tools/pdf-review
      - name: Stage only the reviewer
        run: |
          mkdir -p build/pdf-review-site
          cp downloads/pdf-review.html build/pdf-review-site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pdf-review-site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
